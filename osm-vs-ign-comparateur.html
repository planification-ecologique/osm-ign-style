<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSM en rendu IGN — comparateur</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --pos: 50%; }
  html, body { margin:0; height:100%; overflow:hidden;
               font-family:"Marianne", -apple-system, system-ui, sans-serif; }
  .carte { position:absolute; inset:0; }
  /* Rideau : carte du dessus rognée (clip coupe aussi les events). */
  body.mode-rideau #carte-ign { clip-path: inset(0 0 0 var(--pos)); }

  /* Copie : deux vues du même centre/zoom, côte à côte. */
  body.mode-copie #carte-osm {
    inset: auto; top:0; bottom:0; left:0; width:50%;
  }
  body.mode-copie #carte-ign {
    inset: auto; top:0; bottom:0; left:50%; width:50%;
    clip-path: none;
  }
  body.mode-copie #rideau { display:none; }
  body.mode-copie #separateur { display:block; }
  #separateur { display:none; position:absolute; top:0; bottom:0; left:50%; width:2px;
                background:#000091; z-index:3; pointer-events:none; }

  #rideau { position:absolute; top:0; bottom:0; left:var(--pos); width:2px;
            background:#000091; z-index:3; cursor:ew-resize; }
  #poignee { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             width:40px; height:40px; border-radius:50%; background:#000091;
             border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.3);
             cursor:ew-resize; touch-action:none;
             display:flex; align-items:center; justify-content:center;
             color:#fff; font-size:15px; letter-spacing:-2px; }
  #poignee:focus-visible { outline:3px solid #0a76f6; outline-offset:3px; }

  .etiquette { position:absolute; top:14px; z-index:2; background:rgba(255,255,255,.94);
               border:1px solid #ddd; border-radius:4px; padding:5px 10px;
               font-size:12px; font-weight:500; pointer-events:none; }
  .etiquette span { display:block; font-weight:400; color:#666; font-size:11px; }
  #eti-osm { left:14px; }
  #eti-ign { right:14px; text-align:right; }
  body.mode-copie #eti-ign { right:auto; left:calc(50% + 14px); text-align:left; }

  #pied { position:absolute; right:0; bottom:0; z-index:2;
          background:rgba(255,255,255,.9); font-size:10.5px; color:#444;
          padding:2px 6px; }
  #pied a { color:#000091; }

  #zoom-hud { position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
              z-index:4; display:flex; align-items:center; gap:8px;
              background:rgba(255,255,255,.94); border:1px solid #ddd;
              border-radius:6px; padding:6px 10px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #zoom-hud button { width:28px; height:28px; border:1px solid #000091; border-radius:4px;
                     background:#000091; color:#fff; font-size:16px; line-height:1;
                     cursor:pointer; padding:0; }
  #zoom-hud button:hover { background:#1212a5; }
  #zoom-hud button:focus-visible { outline:3px solid #0a76f6; outline-offset:2px; }
  #zoom-slider { width:min(180px, 28vw); accent-color:#000091; cursor:pointer; }
  #zoom-val { font-size:12px; font-weight:600; color:#000091; min-width:3.6em;
              font-variant-numeric:tabular-nums; text-align:right; }

  #mode-switch { display:flex; border:1px solid #000091; border-radius:4px; overflow:hidden; }
  #mode-switch button { width:auto; height:28px; padding:0 8px; border:none; border-radius:0;
                        background:#fff; color:#000091; font-size:11px; font-weight:600;
                        letter-spacing:0.02em; }
  #mode-switch button[aria-pressed="true"] { background:#000091; color:#fff; }
  #mode-switch button + button { border-left:1px solid #000091; }

  #diag { position:absolute; left:14px; bottom:14px; z-index:4; max-width:320px;
          font-size:12px; color:#fff; background:#b34000; border-radius:4px; }
  #diag div { padding:7px 10px; word-break:break-word; }
  #diag:empty { display:none; }
</style>
</head>
<body class="mode-copie">
<div id="carte-osm" class="carte"></div>
<div id="carte-ign" class="carte"></div>
<div id="separateur" aria-hidden="true"></div>

<div id="rideau">
  <div id="poignee" tabindex="0" role="slider" aria-label="Position du rideau de comparaison"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">◀▶</div>
</div>

<div class="etiquette" id="eti-osm">Données OSM<span>rendu façon IGN</span></div>
<div class="etiquette" id="eti-ign">PLAN IGN<span>tuiles Géoplateforme</span></div>

<div id="zoom-hud" role="group" aria-label="Contrôle du zoom">
  <div id="mode-switch" role="group" aria-label="Mode de comparaison">
    <button type="button" id="mode-copie" aria-pressed="true">Copie</button>
    <button type="button" id="mode-rideau" aria-pressed="false">Rideau</button>
  </div>
  <button type="button" id="zoom-moins" aria-label="Zoom arrière">−</button>
  <input type="range" id="zoom-slider" min="0" max="18" step="0.1" value="8"
         aria-label="Niveau de zoom">
  <button type="button" id="zoom-plus" aria-label="Zoom avant">+</button>
  <span id="zoom-val" aria-live="polite">z 8.0</span>
</div>

<div id="pied">
  © les contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · PLAN IGN © IGN
</div>
<div id="diag"></div>

<script>
const C = {
  fond:        '#FFFFFF',
  ocean:       '#CFE4EE',
  eau:         '#B5D8E8',
  eauTrait:    '#AAD5E9',

  foret:       '#D9EBD0',
  foretOuverte:'#E5F0D4',
  lande:       '#F2EECD',
  verger:      '#FAE2C5',
  vigne:       '#FFEDD9',
  herbe:       '#E9EFDD',
  sable:       '#FAF3E0',
  rocher:      '#EFEDE8',
  glacier:     '#E4F1F6',
  /* Zone bâtie PLAN IGN (#E8E2D1). */
  urbain:      '#E8E2D1',
  industriel:  '#D9D9D9',
  site:        '#F0EDE6',
  sitePublic:  '#E8D4D8',
  siteSport:   '#C9E1DD',

  bati:        '#D6C6B8',
  batiHaut:    '#F1EBD9',
  batiContour: '#C3AA8E',

  chemin:      '#8C7274',
  cycle:       '#9B5CCC',
  rail:        '#787878',
  poi:         '#2E6B9E',

  ecusson:     '#8A8A88',  ecussonBord: '#6E6E6C',
  ponctuel:    '#FFFFFF',  ponctuelBord:'#55524C',

  frontiere:   '#9E8FC4',
  limiteRegion:'#B3A6D2',

  texte:       '#33322F',
  texteHalo:   '#FFFFFF',
  texteEau:    '#3F7A99'
};

const POLICE   = ['Noto Sans Regular'];
const POLICE_G = ['Noto Sans Medium'];
const POLICE_I = ['Noto Sans Italic'];

/* --------------------------------------------------------------------------
   Interpolations calées sur les stops du style PLAN IGN (linéaire).
-------------------------------------------------------------------------- */
const larg  = (paires) => ['interpolate', ['linear'], ['zoom'], ...paires.flat()];
const coulZ = (paires) => ['interpolate', ['linear'], ['zoom'], ...paires.flat()];

/* Zone bâtie : stops IGN (opaque → fondue dès le bâti). */
const opacUrbain = ['interpolate', ['linear'], ['zoom'], 12, 1, 13, 0.9, 14, 0.5, 15, 0];

/* Une classe = casing + fill. Couleurs ET largeurs suivent le zoom
   (ex. régionale blanche à z7–9, jaune pâle ensuite — signature IGN). */
function route(id, filtre, couleur, casing, fillW, caseW, minzoom = 0) {
  const base = { source: 'osm', 'source-layer': 'streets', type: 'line', filter: filtre,
                 minzoom, layout: { 'line-cap': 'round', 'line-join': 'round' } };
  return [
    { ...base, id: id + '-casing',
      paint: { 'line-color': casing, 'line-width': larg(caseW),
               'line-opacity': ['case', ['==', ['get','tunnel'], true], 0.35, 1] } },
    { ...base, id: id,
      paint: { 'line-color': couleur, 'line-width': larg(fillW),
               'line-opacity': ['case', ['==', ['get','tunnel'], true], 0.35, 1] } }
  ];
}

const pasLien = ['any', ['!', ['has', 'link']], ['!=', ['get', 'link'], true]];
const estLien = ['==', ['get', 'link'], true];

const styleOSM = {
  version: 8,
  name: 'OSM — rendu IGN',
  glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
  sources: {
    osm: {
      type: 'vector',
      tiles: ['https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt'],
      minzoom: 0, maxzoom: 14,
      attribution: '© les contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  },
  layers: [
    { id: 'fond', type: 'background', paint: { 'background-color': C.fond } },

    /* --- Occupation du sol -------------------------------------------
       Zone urbaine = couche à part : MapLibre n’autorise qu’UN seul
       interpolate zoom par expression (pas dans un match). */
    { id: 'land', type: 'fill', source: 'osm', 'source-layer': 'land',
      filter: ['!', ['in', ['get','kind'], ['literal',
        ['residential','retail','commercial','garages','brownfield','greenfield']]]],
      paint: { 'fill-color': ['match', ['get','kind'],
        'forest', C.foret,
        'scrub', C.foretOuverte, 'heath', C.lande, 'grassland', C.herbe,
        'grass', C.herbe, 'meadow', C.herbe, 'village_green', C.herbe,
        'park', C.herbe, 'garden', C.herbe, 'recreation_ground', C.herbe,
        'orchard', C.verger, 'plant_nursery', C.verger,
        'vineyard', C.vigne,
        'farmland', '#F7F5F0', 'farmyard', '#F0EDE6', 'allotments', '#F2EFDD',
        'sand', C.sable, 'beach', C.sable, 'shingle', C.sable,
        'bare_rock', C.rocher, 'scree', C.rocher,
        'swamp', '#DCE8E0', 'bog', '#DCE8E0', 'marsh', '#DCE8E0',
        'wet_meadow', '#DCE8E0', 'string_bog', '#DCE8E0',
        'industrial', C.industriel, 'railway', C.industriel,
        'landfill', C.industriel, 'quarry', C.industriel,
        'cemetery', '#E4E8DC', 'grave_yard', '#E4E8DC',
        'golf_course', C.herbe, 'miniature_golf', C.herbe, 'playground', C.herbe,
        'greenhouse_horticulture', '#EFF2E6',
        'transparent' ] } },

    { id: 'zone-urbaine', type: 'fill', source: 'osm', 'source-layer': 'land',
      minzoom: 7, maxzoom: 15,
      filter: ['in', ['get','kind'], ['literal',
        ['residential','garages','brownfield','greenfield']]],
      paint: { 'fill-color': C.urbain, 'fill-opacity': opacUrbain } },

    /* Lavande ZAI IGN (#EBEBF5) — zones d’activité / commercial à z13+. */
    { id: 'zone-activite', type: 'fill', source: 'osm', 'source-layer': 'land',
      minzoom: 13,
      filter: ['in', ['get','kind'], ['literal',
        ['industrial','railway','landfill','quarry','retail','commercial']]],
      paint: { 'fill-color': '#EBEBF5', 'fill-opacity': 0.45,
               'fill-outline-color': '#AAAAAA' } },

    { id: 'sites', type: 'fill', source: 'osm', 'source-layer': 'sites',
      minzoom: 13,
      paint: {
        'fill-color': ['match', ['get','kind'],
          'hospital', C.sitePublic, 'university', C.sitePublic, 'college', C.sitePublic,
          'school', C.sitePublic, 'prison', C.sitePublic,
          'sports_centre', C.siteSport,
          C.site],
        'fill-opacity': 0.7
      } },

    /* --- Eau ---------------------------------------------------------- */
    { id: 'ocean', type: 'fill', source: 'osm', 'source-layer': 'ocean',
      paint: { 'fill-color': C.ocean } },
    { id: 'eau', type: 'fill', source: 'osm', 'source-layer': 'water_polygons',
      paint: { 'fill-color': ['match', ['get','kind'], 'glacier', C.glacier, C.eau],
               'fill-outline-color': C.eauTrait } },
    { id: 'cours-eau-mineur', type: 'line', source: 'osm', 'source-layer': 'water_lines',
      minzoom: 11,
      filter: ['all', ['!=', ['get','tunnel'], true],
                      ['in', ['get','kind'], ['literal',['stream','ditch','canal']]]],
      paint: { 'line-color': C.eauTrait, 'line-width': larg([[12,1.5],[17,4]]) } },
    { id: 'cours-eau', type: 'line', source: 'osm', 'source-layer': 'water_lines',
      filter: ['all', ['!=', ['get','tunnel'], true], ['==', ['get','kind'], 'river']],
      paint: { 'line-color': C.eauTrait, 'line-width': larg([[3,0.8],[8,1.4],[12,2.6],[17,6.5]]) } },

    /* --- Aires piétonnes / service (polygones) ------------------------- */
    { id: 'aires-rue', type: 'fill', source: 'osm', 'source-layer': 'street_polygons',
      minzoom: 14,
      paint: { 'fill-color': '#FFFFFF', 'fill-outline-color': '#969696' } },

    /* --- Bâti : teintes IGN qui s’éclaircissent avec le zoom ----------- */
    { id: 'bati', type: 'fill', source: 'osm', 'source-layer': 'buildings',
      minzoom: 14,
      paint: {
        'fill-color': coulZ([[14, C.bati], [15, '#E6E0CF'], [16, C.batiHaut]]),
        'fill-outline-color': coulZ([[14, 'rgba(195,170,142,0)'], [15, C.batiContour]])
      } },

    /* --- Voies ferrées + hachures type PLAN IGN ----------------------- */
    { id: 'rail', type: 'line', source: 'osm', 'source-layer': 'streets',
      minzoom: 10,
      filter: ['==', ['get','rail'], true],
      paint: { 'line-color': C.rail, 'line-width': larg([[10,0.6],[14,1.2],[17,2.2]]) } },
    { id: 'rail-hachures', type: 'line', source: 'osm', 'source-layer': 'streets',
      minzoom: 12,
      filter: ['==', ['get','rail'], true],
      paint: { 'line-color': C.rail,
               'line-width': larg([[12,2.5],[14,4],[17,10]]),
               'line-dasharray': [0.1, 10] } },

    /* --- Chemins / sentiers / cycles ---------------------------------- */
    { id: 'piste-cycle', type: 'line', source: 'osm', 'source-layer': 'streets',
      minzoom: 14, filter: ['==', ['get','kind'], 'cycleway'],
      paint: { 'line-color': C.cycle, 'line-width': larg([[14,1.1],[17,3.5]]) } },
    { id: 'sentiers', type: 'line', source: 'osm', 'source-layer': 'streets',
      minzoom: 14,
      filter: ['in', ['get','kind'], ['literal',['path','footway','steps']]],
      paint: { 'line-color': C.chemin, 'line-width': larg([[14,1],[17,2],[18,6]]),
               'line-dasharray': [4, 3] } },
    { id: 'chemins', type: 'line', source: 'osm', 'source-layer': 'streets',
      minzoom: 13, filter: ['==', ['get','kind'], 'track'],
      paint: { 'line-color': C.chemin, 'line-width': larg([[14,1],[17,2],[18,7]]) } },

    /* --- Réseau routier (couleurs IGN qui basculent après z7) ---------
       Mapping : motorway→autoroute, trunk/primary→principale,
       secondary→régionale, tertiary→locale, residential→non classée.
       À z10 IGN reste très sélectif : on retarde secondaire/tertiaire. */
    ...route('locale',
      ['in', ['get','kind'], ['literal',
        ['residential','unclassified','living_street','service','pedestrian','busway','bus_guideway']]],
      '#FFFFFF',
      coulZ([[14, '#A0A0A0'], [17, '#969696']]),
      [[12,0.8],[14,2.3],[15,4.1],[16,6.3],[17,13.5]],
      [[12,1.4],[14,3.2],[15,5.4],[16,7.7],[17,16.8]],
      12),

    ...route('tertiaire',
      ['all', ['==', ['get','kind'], 'tertiary'], pasLien],
      coulZ([[6,'#F2B361'],[7,'#FFFFFF'],[12,'#FFFFFF'],[13,'#FEF8D0'],[17,'#FCF7C1']]),
      coulZ([[12,'#8C8C8C'],[13,'#B4B4B4'],[17,'#B4B4B4']]),
      [[12,1.0],[14,2.3],[15,4.1],[16,6.1],[17,13.1]],
      [[12,1.6],[14,3.5],[15,6],[16,8.4],[17,18.3]],
      12),

    ...route('secondaire',
      ['all', ['==', ['get','kind'], 'secondary'], pasLien],
      coulZ([[6,'#F2A949'],[7,'#FFFFFF'],[11,'#FFFFFF'],[12,'#FEF6C8'],[17,'#FCF6BD']]),
      coulZ([[11,'#828282'],[12,'#B4B4B4'],[17,'#B4B4B4']]),
      [[11,1.2],[14,3.2],[15,5.8],[16,8.3],[17,16.2]],
      [[11,1.8],[14,5],[15,8.1],[16,11.2],[17,22]],
      11),

    ...route('primaire',
      ['all', ['==', ['get','kind'], 'primary'], pasLien],
      coulZ([[6,'#F29924'],[7,'#F3C66D'],[9,'#F3C66D'],[17,'#F2DDB3']]),
      coulZ([[8,'#E2A52A'],[17,'#E2A52A']]),
      [[6,1.2],[9,1.5],[14,4.0],[15,6.5],[16,9],[17,16]],
      [[6,1.4],[9,2.0],[14,5.2],[15,8],[16,11],[17,20]],
      8),

    ...route('trunk',
      ['all', ['==', ['get','kind'], 'trunk'], pasLien],
      coulZ([[6,'#F29924'],[7,'#F3C66D'],[9,'#F3C66D'],[17,'#F2DDB3']]),
      coulZ([[8,'#E2A52A'],[17,'#E2A52A']]),
      [[6,1.2],[9,1.5],[14,4.0],[15,6.5],[16,9],[17,16]],
      [[6,1.4],[9,2.0],[14,5.2],[15,8],[16,11],[17,20]],
      6),

    ...route('autoroute',
      ['all', ['==', ['get','kind'], 'motorway'], pasLien],
      coulZ([[9,'#F18800'],[17,'#F2B230']]),
      coulZ([[9,'#DE460E'],[17,'#F18800']]),
      [[4,0.6],[6,1.8],[9,2.2],[14,5.0],[15,8],[16,11],[17,18]],
      [[6,2.0],[9,2.8],[14,6.5],[15,9.5],[16,13],[17,22]],
      5),

    /* Bretelles (links) : plus fines, à partir de z12. */
    ...route('bretelle',
      ['all',
        ['in', ['get','kind'], ['literal',['motorway','trunk','primary','secondary','tertiary']]],
        estLien],
      coulZ([[9,'#F18800'],[17,'#F2B230']]),
      coulZ([[9,'#DE460E'],[17,'#F18800']]),
      [[12,1.5],[14,2.6],[15,5.2],[16,6.7],[17,10.8]],
      [[12,2.5],[14,3.7],[15,6.8],[16,8.4],[17,14]],
      12),

    /* Axe blanc central des autoroutes (z13+). */
    { id: 'autoroute-axe', type: 'line', source: 'osm', 'source-layer': 'streets',
      minzoom: 13,
      filter: ['all', ['==', ['get','kind'], 'motorway'], pasLien,
               ['!=', ['get','tunnel'], true]],
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': '#FFFFFF',
               'line-width': larg([[13,0.6],[14,0.7],[15,1],[16,1.2],[17,2.1]]) } },

    /* --- Limites ------------------------------------------------------
       Shortbread ne porte que admin_level 2 (pays) et 4 (région).
       Les limites départementales sont hors de portée de ces tuiles. */
    { id: 'limite-region', type: 'line', source: 'osm', 'source-layer': 'boundaries',
      filter: ['all', ['==', ['get','admin_level'], 4], ['!=', ['get','maritime'], true]],
      minzoom: 6,
      paint: { 'line-color': C.limiteRegion,
               'line-width': larg([[6,0.8],[10,1.4],[14,2]]),
               'line-dasharray': [5, 3] } },
    { id: 'frontiere', type: 'line', source: 'osm', 'source-layer': 'boundaries',
      filter: ['all', ['==', ['get','admin_level'], 2], ['!=', ['get','maritime'], true]],
      paint: { 'line-color': C.frontiere,
               'line-width': larg([[3,0.8],[8,2],[12,3]]),
               'line-dasharray': [3, 1.5] } },

    /* --- Écritures ---------------------------------------------------- */
    { id: 'lbl-eau', type: 'symbol', source: 'osm', 'source-layer': 'water_polygons_labels',
      minzoom: 12,
      filter: ['>', ['get', 'way_area'], 500000],
      layout: { 'text-field': ['get','name'], 'text-font': POLICE_I, 'text-size': 11,
                'text-max-width': 7,
                'text-padding': 12 },
      paint: { 'text-color': C.texteEau, 'text-halo-color': C.texteHalo, 'text-halo-width': 1.2 } },

    { id: 'lbl-cours-eau', type: 'symbol', source: 'osm', 'source-layer': 'water_lines_labels',
      minzoom: 13,
      filter: ['==', ['get','kind'], 'river'],
      layout: { 'symbol-placement': 'line', 'text-field': ['get','name'],
                'text-font': POLICE_I, 'text-size': 11 },
      paint: { 'text-color': C.texteEau, 'text-halo-color': C.texteHalo, 'text-halo-width': 1 } },

    { id: 'lbl-rue', type: 'symbol', source: 'osm', 'source-layer': 'street_labels',
      minzoom: 14, filter: ['has','name'],
      layout: { 'symbol-placement': 'line', 'text-field': ['get','name'],
                'text-font': POLICE,
                'text-size': ['interpolate', ['linear'], ['zoom'], 14, 9.5, 17, 12],
                'text-padding': 4 },
      paint: { 'text-color': '#000000', 'text-halo-color': C.texteHalo, 'text-halo-width': 1.4 } },

    /* Écussons de route : le fond est une image 9-tranches fabriquée au
       chargement (voir creerEcusson), ce qui évite un fichier sprite. */
    { id: 'ecussons', type: 'symbol', source: 'osm', 'source-layer': 'street_labels',
      minzoom: 8,
      filter: ['all', ['has','ref'],
               ['in', ['get','kind'], ['literal',['motorway','trunk','primary']]]],
      layout: { 'symbol-placement': 'line', 'symbol-spacing': 220,
                'text-field': ['get','ref'], 'text-font': POLICE_G, 'text-size': 10,
                'text-rotation-alignment': 'viewport',
                'icon-rotation-alignment': 'viewport',
                'icon-image': 'ecusson', 'icon-text-fit': 'both',
                'icon-text-fit-padding': [1, 4, 1, 4],
                'text-padding': 2, 'icon-allow-overlap': false },
      paint: { 'text-color': '#FFFFFF' } },

    /* Sorties d’autoroute. */

          11, ['match', ['get','kind'], 'capital', 3.5, 'state_capital', 3, 'city', 2.6, 2]],
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 12, 1, 14, 0] } },

    { id: 'pct-village', type: 'circle', source: 'osm', 'source-layer': 'place_labels',
      minzoom: 10, maxzoom: 14,
      filter: ['in', ['get','kind'], ['literal',['village','hamlet']]],
      paint: {
        'circle-color': C.ponctuel,

        'circle-stroke-width': 0.8,
        'circle-radius': 1.2,
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 12, 1, 14, 0] } },

    /* Villes / bourgs — IGN : casse mixte, Regular, tailles discrètes. */
    { id: 'lbl-lieu', type: 'symbol', source: 'osm', 'source-layer': 'place_labels',
      filter: ['in', ['get','kind'], ['literal',
        ['capital','state_capital','city','town']]],

          10, ['match', ['get','kind'], 'capital', 14, 'state_capital', 12, 'city', 11, 'town', 10, 9],

/* ------------------------------------------------------------------------ */

/* ------------------------------------------------------------------------ */
const STYLE_IGN = 'https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json';
const VUE = { center: [7.05, 45.35], zoom: 8 };   // frontière franco-italienne

const commun = { attributionControl: false, ...VUE };
const carteOSM = new maplibregl.Map({ container: 'carte-osm', style: styleOSM, hash: true, ...commun });
const carteIGN = new maplibregl.Map({ container: 'carte-ign', style: STYLE_IGN, ...commun });

carteOSM.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

/* --- Zoom HUD ------------------------------------------------------------
   Slider + boutons ± + niveau affiché. Les deux cartes restent sync via
   suivre() ; on pilote uniquement carteOSM. */
const Z_MIN = 0, Z_MAX = 18, Z_PAS = 0.5;
const zoomSlider = document.getElementById('zoom-slider');
const zoomVal    = document.getElementById('zoom-val');
let zoomUi = false;   // évite de renvoyer setZoom quand l'UI suit la carte

function afficherZoom(z) {
  const n = Math.min(Z_MAX, Math.max(Z_MIN, z));
  zoomVal.textContent = 'z ' + n.toFixed(1);
  zoomSlider.value = n.toFixed(1);
}

function appliquerZoom(z) {
  const n = Math.min(Z_MAX, Math.max(Z_MIN, z));
  zoomUi = true;
  afficherZoom(n);
  carteOSM.zoomTo(n, { duration: 0 });
  zoomUi = false;
}

zoomSlider.addEventListener('input', () => appliquerZoom(+zoomSlider.value));
document.getElementById('zoom-moins').addEventListener('click',
  () => appliquerZoom(carteOSM.getZoom() - Z_PAS));
document.getElementById('zoom-plus').addEventListener('click',
  () => appliquerZoom(carteOSM.getZoom() + Z_PAS));
carteOSM.on('zoom', () => { if (!zoomUi) afficherZoom(carteOSM.getZoom()); });
afficherZoom(VUE.zoom);

/* --- Mode Copie / Rideau ------------------------------------------------ */
function setMode(mode) {
  const copie = mode === 'copie';
  document.body.classList.toggle('mode-copie', copie);
  document.body.classList.toggle('mode-rideau', !copie);
  document.getElementById('mode-copie').setAttribute('aria-pressed', copie ? 'true' : 'false');
  document.getElementById('mode-rideau').setAttribute('aria-pressed', copie ? 'false' : 'true');
  requestAnimationFrame(() => {
    carteOSM.resize();
    carteIGN.resize();
    syncCameras();
  });
}
document.getElementById('mode-copie').addEventListener('click', () => setMode('copie'));
document.getElementById('mode-rideau').addEventListener('click', () => setMode('rideau'));

/* --- Écusson de route ----------------------------------------------------
   MapLibre sait étirer une image en 9 tranches (stretchX/stretchY/content)
   pour l'ajuster au texte via icon-text-fit. On la dessine sur un canvas
   plutôt que de maintenir un fichier sprite pour un seul symbole. */
function creerEcusson(carte) {
  if (carte.hasImage('ecusson')) return;
  const L = 28, H = 22, R = 5, PR = 2;   // PR : rendu en 14×11 px CSS
  const c = document.createElement('canvas');
  c.width = L; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = C.ecusson;
  g.strokeStyle = C.ecussonBord;
  g.lineWidth = 1;
  g.beginPath();
  g.roundRect ? g.roundRect(0.5, 0.5, L - 1, H - 1, R)
              : g.rect(0.5, 0.5, L - 1, H - 1);
  g.fill(); g.stroke();
  carte.addImage('ecusson', g.getImageData(0, 0, L, H), {
    stretchX: [[R + 2, L - R - 2]],
    stretchY: [[R + 2, H - R - 2]],
    content:  [3, 2, L - 3, H - 2],
    pixelRatio: PR
  });
}
carteOSM.on('load', () => creerEcusson(carteOSM));
carteOSM.on('styleimagemissing', e => { if (e.id === 'ecusson') creerEcusson(carteOSM); });

/* --- Synchronisation des deux caméras ------------------------------------
   Le drapeau évite la boucle : A bouge → B saute → B émet "move" → A saute… */
let enCours = false;
function suivre(source, cible) {
  source.on('move', () => {
    if (enCours) return;
    enCours = true;
    cible.jumpTo({
      center:  source.getCenter(),
      zoom:    source.getZoom(),
      bearing: source.getBearing(),
      pitch:   source.getPitch()
    });
    enCours = false;
  });
}
suivre(carteOSM, carteIGN);
suivre(carteIGN, carteOSM);

/* Hash ne pilote que OSM : forcer IGN dès que les deux styles sont prêts. */
function syncCameras() {
  if (enCours) return;
  enCours = true;
  carteIGN.jumpTo({
    center:  carteOSM.getCenter(),
    zoom:    carteOSM.getZoom(),
    bearing: carteOSM.getBearing(),
    pitch:   carteOSM.getPitch()
  });
  enCours = false;
  afficherZoom(carteOSM.getZoom());
}
carteOSM.on('load', syncCameras);
carteIGN.on('load', syncCameras);
carteOSM.on('load', () => { carteOSM.resize(); carteIGN.resize(); });
carteIGN.on('load', () => { carteOSM.resize(); carteIGN.resize(); });

/* --- Rideau --------------------------------------------------------------- */
const rideau  = document.getElementById('rideau');
const poignee = document.getElementById('poignee');
let pos = 50;

function placer(p) {
  pos = Math.min(100, Math.max(0, p));
  document.documentElement.style.setProperty('--pos', pos + '%');
  poignee.setAttribute('aria-valuenow', Math.round(pos));
}

function depuisPointeur(e) { placer((e.clientX / window.innerWidth) * 100); }

poignee.addEventListener('pointerdown', e => {
  poignee.setPointerCapture(e.pointerId);
  poignee.addEventListener('pointermove', depuisPointeur);
  e.preventDefault();
});
poignee.addEventListener('pointerup', e => {
  poignee.releasePointerCapture(e.pointerId);
  poignee.removeEventListener('pointermove', depuisPointeur);
});
poignee.addEventListener('keydown', e => {
  const pas = e.shiftKey ? 10 : 2;
  if (e.key === 'ArrowLeft')  { placer(pos - pas); e.preventDefault(); }
  if (e.key === 'ArrowRight') { placer(pos + pas); e.preventDefault(); }
  if (e.key === 'Home')       { placer(0);   e.preventDefault(); }
  if (e.key === 'End')        { placer(100); e.preventDefault(); }
});
rideau.addEventListener('dblclick', () => placer(50));

/* --- Diagnostic ----------------------------------------------------------
   Une erreur de style fait échouer le rendu en silence : on l'affiche. */
const diag = document.getElementById('diag');
const vus = new Set();
function signaler(msg) {
  if (vus.has(msg)) return;
  vus.add(msg);
  const d = document.createElement('div');
  d.textContent = msg;
  diag.appendChild(d);
}
[carteOSM, carteIGN].forEach(c => c.on('error', e => {
  const m = (e && e.error && e.error.message) || 'erreur inconnue';
  console.warn('MapLibre:', m);
  signaler(m);
}));

fetch('https://vector.openstreetmap.org/shortbread_v1/tilejson.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
  .catch(e => signaler('Tuiles OSMF injoignables (' + e.message + ')'));

/* Le nom du fontstack doit correspondre exactement à un dossier de
   protomaps/basemaps-assets : « Noto Sans Regular », « Noto Sans Medium »,
   « Noto Sans Italic ». Il n'y a pas de graisse Bold. */
[POLICE[0], POLICE_G[0], POLICE_I[0]].forEach(f =>
  fetch(styleOSM.glyphs.replace('{fontstack}', encodeURIComponent(f)).replace('{range}', '0-255'))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .catch(e => signaler('Police « ' + f + ' » indisponible (' + e.message +
      ') : les libellés correspondants ne s’afficheront pas.')));
</script>
