<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSM en rendu IGN — comparateur</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --pos: 50%; }
  html, body { margin:0; height:100%; overflow:hidden;
               font-family:"Marianne", -apple-system, system-ui, sans-serif; }
  .carte { position:absolute; inset:0; }
  /* Rideau : carte du dessus rognée (clip coupe aussi les events). */
  body.mode-rideau #carte-ign { clip-path: inset(0 0 0 var(--pos)); }

  /* Copie : deux vues du même centre/zoom, côte à côte. */
  body.mode-copie #carte-osm {
    inset: auto; top:0; bottom:0; left:0; width:50%;
  }
  body.mode-copie #carte-ign {
    inset: auto; top:0; bottom:0; left:50%; width:50%;
    clip-path: none;
  }
  body.mode-copie #rideau { display:none; }
  body.mode-copie #separateur { display:block; }
  #separateur { display:none; position:absolute; top:0; bottom:0; left:50%; width:2px;
                background:#000091; z-index:3; pointer-events:none; }

  #rideau { position:absolute; top:0; bottom:0; left:var(--pos); width:2px;
            background:#000091; z-index:3; cursor:ew-resize; }
  #poignee { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             width:40px; height:40px; border-radius:50%; background:#000091;
             border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.3);
             cursor:ew-resize; touch-action:none;
             display:flex; align-items:center; justify-content:center;
             color:#fff; font-size:15px; letter-spacing:-2px; }
  #poignee:focus-visible { outline:3px solid #0a76f6; outline-offset:3px; }

  .etiquette { position:absolute; top:14px; z-index:2; background:rgba(255,255,255,.94);
               border:1px solid #ddd; border-radius:4px; padding:5px 10px;
               font-size:12px; font-weight:500; pointer-events:none; }
  .etiquette span { display:block; font-weight:400; color:#666; font-size:11px; }
  #eti-osm { left:14px; }
  #eti-ign { right:14px; text-align:right; }
  body.mode-copie #eti-ign { right:auto; left:calc(50% + 14px); text-align:left; }

  #pied { position:absolute; right:0; bottom:0; z-index:2;
          background:rgba(255,255,255,.9); font-size:10.5px; color:#444;
          padding:2px 6px; }
  #pied a { color:#000091; }

  #zoom-hud { position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
              z-index:4; display:flex; align-items:center; gap:8px;
              background:rgba(255,255,255,.94); border:1px solid #ddd;
              border-radius:6px; padding:6px 10px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #zoom-hud button { width:28px; height:28px; border:1px solid #000091; border-radius:4px;
                     background:#000091; color:#fff; font-size:16px; line-height:1;
                     cursor:pointer; padding:0; }
  #zoom-hud button:hover { background:#1212a5; }
  #zoom-hud button:focus-visible { outline:3px solid #0a76f6; outline-offset:2px; }
  #zoom-slider { width:min(180px, 28vw); accent-color:#000091; cursor:pointer; }
  #zoom-val { font-size:12px; font-weight:600; color:#000091; min-width:3.6em;
              font-variant-numeric:tabular-nums; text-align:right; }

  #mode-switch { display:flex; border:1px solid #000091; border-radius:4px; overflow:hidden; }
  #mode-switch button { width:auto; height:28px; padding:0 8px; border:none; border-radius:0;
                        background:#fff; color:#000091; font-size:11px; font-weight:600;
                        letter-spacing:0.02em; }
  #mode-switch button[aria-pressed="true"] { background:#000091; color:#fff; }
  #mode-switch button + button { border-left:1px solid #000091; }

  #diag { position:absolute; left:14px; bottom:14px; z-index:4; max-width:320px;
          font-size:12px; color:#fff; background:#b34000; border-radius:4px; }
  #diag div { padding:7px 10px; word-break:break-word; }
  #diag:empty { display:none; }
</style>
</head>
<body class="mode-copie">
<div id="carte-osm" class="carte"></div>
<div id="carte-ign" class="carte"></div>
<div id="separateur" aria-hidden="true"></div>

<div id="rideau">
  <div id="poignee" tabindex="0" role="slider" aria-label="Position du rideau de comparaison"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">◀▶</div>
</div>

<div class="etiquette" id="eti-osm">Données OSM<span>rendu façon IGN</span></div>
<div class="etiquette" id="eti-ign">PLAN IGN<span>tuiles Géoplateforme</span></div>

<div id="zoom-hud" role="group" aria-label="Contrôle du zoom">
  <div id="mode-switch" role="group" aria-label="Mode de comparaison">
    <button type="button" id="mode-copie" aria-pressed="true">Copie</button>
    <button type="button" id="mode-rideau" aria-pressed="false">Rideau</button>
  </div>
  <button type="button" id="zoom-moins" aria-label="Zoom arrière">−</button>
  <input type="range" id="zoom-slider" min="0" max="18" step="0.1" value="8"
         aria-label="Niveau de zoom">
  <button type="button" id="zoom-plus" aria-label="Zoom avant">+</button>
  <span id="zoom-val" aria-live="polite">z 8.0</span>
</div>

<div id="pied">
  © les contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · relief © Mapzen · PLAN IGN © IGN
</div>
<div id="diag"></div>

<script>
const C = {
  fond:        '#F4F2EB',
  /* Hydro PLAN IGN (#AAD5E9). */
  ocean:       '#AAD5E9',
  eau:         '#AAD5E9',
  eauTrait:    '#7EB6D2',

  /* Végétation PLAN IGN. */
  foret:       '#DFE8D5',
  foretOuverte:'#EDF2D9',
  lande:       '#F2EECD',
  verger:      '#FAE2C5',
  vigne:       '#FFEDD9',
  herbe:       '#E9EFDD',
  sable:       '#FAF3E0',
  rocher:      '#EFEDE8',
  glacier:     '#E4F1F6',
  /* Zone bâtie PLAN IGN. */
  urbain:      '#E8E2D1',
  industriel:  '#D9D9D9',
  site:        '#F0EDE6',
  sitePublic:  '#B9B6D6',
  siteSport:   '#C9E1DD',

  bati:        '#D6C6B8',
  batiHaut:    '#F1EBD9',
  batiContour: '#C3AA8E',

  chemin:      '#8C7274',
  cycle:       '#9B5CCC',
  rail:        '#787878',
  poi:         '#2E6B9E',

  ecusson:     '#8A8A88',  ecussonBord: '#6E6E6C',
  ponctuel:    '#FFFFFF',  ponctuelBord:'#55524C',

  frontiere:   '#9E8FC4',
  limiteRegion:'#B3A6D2',

  texte:       '#33322F',
  texteHalo:   '#FFFFFF',
  texteEau:    '#447FB3'
};

const POLICE   = ['Noto Sans Regular'];
const POLICE_G = ['Noto Sans Medium'];
const POLICE_I = ['Noto Sans Italic'];

/* Banlieues OSM souvent taguées city/town avec grosse pop — pas à z7 IGN. */
const BANLIEUE = ['literal', [
  'Villeurbanne','Vénissieux','Vaulx-en-Velin','Saint-Priest','Caluire-et-Cuire',
  'Vénissieux','Échirolles','Fontaine','Saint-Martin-d\'Hères','Meylan',
  'Montreuil','Argenteuil','Boulogne-Billancourt','Saint-Denis','Nanterre',
  'Vitry-sur-Seine','Créteil','Colombes','Aubervilliers','Asnières-sur-Seine',
  'Courbevoie','Rueil-Malmaison','Champigny-sur-Marne','Aulnay-sous-Bois',
  'Saint-Maur-des-Fossés','Drancy','Issy-les-Moulineaux','Noisy-le-Grand',
  'Levallois-Perret','Neuilly-sur-Seine','Antony','Clichy','Ivry-sur-Seine',
  'La Seyne-sur-Mer','Aubagne','La Ciotat','Six-Fours-les-Plages','Garches',
  'Gennevilliers','Suresnes','Vincennes','Savigny-sur-Orge','Tremblay-en-France',
  'Poissy','Plaisir','Roissy-en-Brie','Conflans-Sainte-Honorine',
  'Sotteville-lès-Rouen','Le Grand-Quevilly','Le Petit-Quevilly','Mont-Saint-Aignan'
]];
const pasBanlieue = ['!', ['in', ['get','name'], BANLIEUE]];

/* --------------------------------------------------------------------------
   Interpolations calées sur les stops du style PLAN IGN (linéaire).
-------------------------------------------------------------------------- */
const larg  = (paires) => ['interpolate', ['linear'], ['zoom'], ...paires.flat()];
const coulZ = (paires) => ['interpolate', ['linear'], ['zoom'], ...paires.flat()];

/* Zone bâtie : stops IGN (opaque → fondue dès le bâti). */
const opacUrbain = ['interpolate', ['linear'], ['zoom'], 12, 1, 13, 0.9, 14, 0.5, 15, 0];

/* Une classe = casing + fill. casingMinzoom : filet extérieur IGN souvent plus tard. */
function route(id, filtre, couleur, casing, fillW, caseW, minzoom = 0, casingMinzoom = null) {
  const base = { source: 'osm', 'source-layer': 'streets', type: 'line', filter: filtre,
                 layout: { 'line-cap': 'round', 'line-join': 'round' } };
  return [
    { ...base, id: id + '-casing', minzoom: casingMinzoom ?? minzoom,
      paint: { 'line-color': casing, 'line-width': larg(caseW),
               'line-opacity': ['case', ['==', ['get','tunnel'], true], 0.35, 1] } },
    { ...base, id: id, minzoom,
      paint: { 'line-color': couleur, 'line-width': larg(fillW),
               'line-opacity': ['case', ['==', ['get','tunnel'], true], 0.35, 1] } }
  ];
}

const pasLien = ['any', ['!', ['has', 'link']], ['!=', ['get', 'link'], true]];
const estLien = ['==', ['get', 'link'], true];

const styleOSM = {
  version: 8,
  name: 'OSM — rendu IGN',
  glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
  sources: {
    osm: {
      type: 'vector',
      tiles: ['https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt'],
      minzoom: 0, maxzoom: 14,
      attribution: '© les contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    },
    /* Estompage (Terrarium / Mapzen) — PLAN IGN a un relief, Shortbread non. */
    dem: {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding: 'terrarium',
      tileSize: 256,
      maxzoom: 15,
      attribution: 'Relief © Mapzen'
    },
    /* Toponymes hydro / parcs absents de Shortbread — points curatés FR. */
    toponymesFr: {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [
          { type:'Feature', properties:{ kind:'mer', name:'MÉDITERRANÉE' }, geometry:{ type:'Point', coordinates:[5.5, 41.7] } },
          { type:'Feature', properties:{ kind:'golfe', name:'GOLFE DU LION' }, geometry:{ type:'Point', coordinates:[4.1, 42.75] } },
          { type:'Feature', properties:{ kind:'mer', name:'MANCHE' }, geometry:{ type:'Point', coordinates:[0.8, 49.85] } },
          { type:'Feature', properties:{ kind:'mer', name:'GOLFE DE GASCOGNE' }, geometry:{ type:'Point', coordinates:[-3.5, 45.2] } },
          /* Parcs : Title Case + italique (comme PLAN IGN), pas UPPERCASE criard. */
          { type:'Feature', properties:{ kind:'parc', name:'Cévennes' }, geometry:{ type:'Point', coordinates:[3.58, 44.2] } },
          { type:'Feature', properties:{ kind:'parc', name:'Vanoise' }, geometry:{ type:'Point', coordinates:[6.85, 45.35] } },
          { type:'Feature', properties:{ kind:'parc', name:'Écrins' }, geometry:{ type:'Point', coordinates:[6.25, 44.9] } },
          { type:'Feature', properties:{ kind:'parc', name:'Mercantour' }, geometry:{ type:'Point', coordinates:[7.15, 44.15] } },
          { type:'Feature', properties:{ kind:'parc', name:'Luberon' }, geometry:{ type:'Point', coordinates:[5.35, 43.8] } },
          { type:'Feature', properties:{ kind:'parc', name:'Vercors' }, geometry:{ type:'Point', coordinates:[5.35, 44.95] } },
          { type:'Feature', properties:{ kind:'parc', name:'Chartreuse' }, geometry:{ type:'Point', coordinates:[5.75, 45.35] } },
          { type:'Feature', properties:{ kind:'parc', name:'Camargue' }, geometry:{ type:'Point', coordinates:[4.55, 43.52] } },
          { type:'Feature', properties:{ kind:'parc', name:'Fontainebleau' }, geometry:{ type:'Point', coordinates:[2.67, 48.4] } },
          { type:'Feature', properties:{ kind:'parc', name:'Morvan' }, geometry:{ type:'Point', coordinates:[4.05, 47.15] } },
          { type:'Feature', properties:{ kind:'parc', name:'Queyras' }, geometry:{ type:'Point', coordinates:[6.8, 44.75] } },
          /* Villes absentes des tuiles Shortbread avant z6 — pont bas zoom façon IGN. */
          { type:'Feature', properties:{ kind:'ville', name:'Avignon', pop:90000 }, geometry:{ type:'Point', coordinates:[4.81, 43.95] } },
          { type:'Feature', properties:{ kind:'ville', name:'Nîmes', pop:148000 }, geometry:{ type:'Point', coordinates:[4.36, 43.84] } },
          { type:'Feature', properties:{ kind:'ville', name:'Valence', pop:64000 }, geometry:{ type:'Point', coordinates:[4.89, 44.93] } },
          { type:'Feature', properties:{ kind:'ville', name:'Grenoble', pop:157000 }, geometry:{ type:'Point', coordinates:[5.72, 45.19] } },
          { type:'Feature', properties:{ kind:'ville', name:'Aix-en-Provence', pop:147000 }, geometry:{ type:'Point', coordinates:[5.45, 43.53] } },
          { type:'Feature', properties:{ kind:'ville', name:'Toulon', pop:180000 }, geometry:{ type:'Point', coordinates:[5.93, 43.12] } },
          { type:'Feature', properties:{ kind:'ville', name:'Montpellier', pop:302000 }, geometry:{ type:'Point', coordinates:[3.88, 43.61] } },
          { type:'Feature', properties:{ kind:'ville', name:'Nice', pop:348000 }, geometry:{ type:'Point', coordinates:[7.27, 43.70] } },
          { type:'Feature', properties:{ kind:'ville', name:'Reims', pop:180000 }, geometry:{ type:'Point', coordinates:[4.03, 49.26] } },
          { type:'Feature', properties:{ kind:'ville', name:'Amiens', pop:130000 }, geometry:{ type:'Point', coordinates:[2.30, 49.89] } },
          { type:'Feature', properties:{ kind:'ville', name:'Tours', pop:135000 }, geometry:{ type:'Point', coordinates:[0.68, 47.39] } },
          { type:'Feature', properties:{ kind:'ville', name:'Angers', pop:155000 }, geometry:{ type:'Point', coordinates:[-0.55, 47.47] } },
          { type:'Feature', properties:{ kind:'ville', name:'Le Mans', pop:145000 }, geometry:{ type:'Point', coordinates:[0.20, 48.01] } },
          { type:'Feature', properties:{ kind:'ville', name:'Caen', pop:105000 }, geometry:{ type:'Point', coordinates:[-0.37, 49.18] } },
          { type:'Feature', properties:{ kind:'ville', name:'Clermont-Ferrand', pop:147000 }, geometry:{ type:'Point', coordinates:[3.09, 45.78] } },
          { type:'Feature', properties:{ kind:'ville', name:'Dijon', pop:155000 }, geometry:{ type:'Point', coordinates:[5.04, 47.32] } },
          { type:'Feature', properties:{ kind:'ville', name:'Besançon', pop:120000 }, geometry:{ type:'Point', coordinates:[6.02, 47.24] } },
          { type:'Feature', properties:{ kind:'ville', name:'Nancy', pop:105000 }, geometry:{ type:'Point', coordinates:[6.18, 48.69] } },
          { type:'Feature', properties:{ kind:'ville', name:'Metz', pop:120000 }, geometry:{ type:'Point', coordinates:[6.18, 49.12] } },
          { type:'Feature', properties:{ kind:'ville', name:'Perpignan', pop:120000 }, geometry:{ type:'Point', coordinates:[2.90, 42.70] } },
          { type:'Feature', properties:{ kind:'ville', name:'Pau', pop:77000 }, geometry:{ type:'Point', coordinates:[-0.37, 43.30] } },
          { type:'Feature', properties:{ kind:'ville', name:'Limoges', pop:130000 }, geometry:{ type:'Point', coordinates:[1.26, 45.84] } },
          { type:'Feature', properties:{ kind:'ville', name:'Poitiers', pop:90000 }, geometry:{ type:'Point', coordinates:[0.34, 46.58] } },
          { type:'Feature', properties:{ kind:'ville', name:'Brest', pop:140000 }, geometry:{ type:'Point', coordinates:[-4.49, 48.39] } },
          { type:'Feature', properties:{ kind:'ville', name:'Saint-Étienne', pop:173000 }, geometry:{ type:'Point', coordinates:[4.39, 45.44] } },
          { type:'Feature', properties:{ kind:'ville', name:'Annecy', pop:130000 }, geometry:{ type:'Point', coordinates:[6.13, 45.90] } }
        ]
      }
    }
  },
  layers: [
    { id: 'fond', type: 'background', paint: { 'background-color': C.fond } },

    /* --- Occupation du sol -------------------------------------------
       Zone urbaine = couche à part : MapLibre n’autorise qu’UN seul
       interpolate zoom par expression (pas dans un match). */
    { id: 'land', type: 'fill', source: 'osm', 'source-layer': 'land',
      filter: ['!', ['in', ['get','kind'], ['literal',
        ['residential','retail','commercial','garages','brownfield','greenfield',
         'forest','scrub','heath']]]],
      paint: { 'fill-color': ['match', ['get','kind'],
        'grassland', C.herbe,
        'grass', C.herbe, 'meadow', C.herbe, 'village_green', C.herbe,
        'park', C.herbe, 'garden', C.herbe, 'recreation_ground', C.herbe,
        'orchard', C.verger, 'plant_nursery', C.verger,
        'vineyard', C.vigne,
        'farmland', '#F7F5F0', 'farmyard', '#F0EDE6', 'allotments', '#F2EFDD',
        'sand', C.sable, 'beach', C.sable, 'shingle', C.sable,
        'bare_rock', C.rocher, 'scree', C.rocher,
        'swamp', '#DCE8E0', 'bog', '#DCE8E0', 'marsh', '#DCE8E0',
        'wet_meadow', '#DCE8E0', 'string_bog', '#DCE8E0',
        'industrial', C.industriel, 'railway', C.industriel,
        'landfill', C.industriel, 'quarry', C.industriel,
        'cemetery', '#E4E8DC', 'grave_yard', '#E4E8DC',
        'golf_course', C.herbe, 'miniature_golf', C.herbe, 'playground', C.herbe,
        'greenhouse_horticulture', '#EFF2E6',
        'transparent' ] } },

    /* Forêt : teinte un peu plus soutenue à petit zoom (IGN #DFE8D5 ne se lit
       que sur des masses généralisées ; OSM est trop fin sur fond blanc). */
    { id: 'foret', type: 'fill', source: 'osm', 'source-layer': 'land',
      filter: ['==', ['get','kind'], 'forest'],
      paint: {
        'fill-color': ['interpolate', ['linear'], ['zoom'], 4, '#B5CBA0', 8, '#C9D7B4', 12, '#DFE8D5'],
        'fill-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0.9, 8, 1]
      } },
    { id: 'foret-ouverte', type: 'fill', source: 'osm', 'source-layer': 'land',
      filter: ['==', ['get','kind'], 'scrub'],
      paint: { 'fill-color': C.foretOuverte, 'fill-opacity': 0.9 } },
    { id: 'lande', type: 'fill', source: 'osm', 'source-layer': 'land',
      filter: ['==', ['get','kind'], 'heath'],
      paint: { 'fill-color': C.lande, 'fill-opacity': 0.9 } },

    { id: 'zone-urbaine', type: 'fill', source: 'osm', 'source-layer': 'land',
      minzoom: 6, maxzoom: 15,
      filter: ['in', ['get','kind'], ['literal',
        ['residential','retail','commercial','garages','brownfield','greenfield']]],
      paint: { 'fill-color': C.urbain, 'fill-opacity': opacUrbain } },

    /* Empreinte urbaine z5–11 (landuse residential souvent absent à z7). */
    { id: 'halo-urbain', type: 'circle', source: 'osm', 'source-layer': 'place_labels',
      minzoom: 5, maxzoom: 11,
      filter: ['all',
        ['in', ['get','kind'], ['literal',['capital','state_capital','city']]],
        pasBanlieue,
        ['>', ['to-number', ['coalesce', ['get','population'], 0]], 60000]],
      paint: {
        'circle-color': C.urbain,
        'circle-radius': ['interpolate', ['linear'], ['zoom'],
          5, ['match', ['get','kind'], 'capital', 28, 'state_capital', 22, 'city', 18, 12],
          7, ['match', ['get','kind'], 'capital', 46, 'state_capital', 36, 'city', 28, 16],
          9, ['match', ['get','kind'], 'capital', 54, 'state_capital', 42, 'city', 32, 18],
          11, ['match', ['get','kind'], 'capital', 40, 'state_capital', 30, 'city', 22, 12]],
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.55, 7, 0.7, 10, 0.35, 11, 0],
        'circle-blur': 0.88
      } },
    { id: 'halo-bourg', type: 'circle', source: 'osm', 'source-layer': 'place_labels',
      minzoom: 7, maxzoom: 10,
      filter: ['all',
        ['==', ['get','kind'], 'town'],
        pasBanlieue,
        ['>', ['to-number', ['get','population']], 35000]],
      paint: {
        'circle-color': C.urbain,
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 7, 11, 8, 15, 10, 12],
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0.45, 8, 0.5, 10, 0],
        'circle-blur': 0.85
      } },

    /* Lavande ZAI IGN (#EBEBF5) — zones d’activité / commercial à z13+. */
    { id: 'zone-activite', type: 'fill', source: 'osm', 'source-layer': 'land',
      minzoom: 13,
      filter: ['in', ['get','kind'], ['literal',
        ['industrial','railway','landfill','quarry','retail','commercial']]],
      paint: { 'fill-color': '#EBEBF5', 'fill-opacity': 0.55,
               'fill-outline-color': '#C8C8C8' } },

    { id: 'sites', type: 'fill', source: 'osm', 'source-layer': 'sites',
      minzoom: 13,
      paint: {
        'fill-color': ['match', ['get','kind'],
          'hospital', C.sitePublic, 'university', C.sitePublic, 'college', C.sitePublic,
          'school', C.sitePublic, 'prison', C.sitePublic,
          'sports_centre', C.siteSport,
          C.site],
        'fill-opacity': 0.7
      } },

    /* --- Eau ---------------------------------------------------------- */
    { id: 'relief', type: 'hillshade', source: 'dem',
      paint: {
        'hillshade-exaggeration': ['interpolate', ['linear'], ['zoom'], 4, 0.55, 8, 0.4, 13, 0.18],
        'hillshade-shadow-color': '#6E675C',
        'hillshade-highlight-color': '#FFFFFF',
        'hillshade-accent-color': '#8C9178',
        'hillshade-illumination-direction': 335
      } },
    { id: 'ocean', type: 'fill', source: 'osm', 'source-layer': 'ocean',
      paint: { 'fill-color': C.ocean } },
    { id: 'eau', type: 'fill', source: 'osm', 'source-layer': 'water_polygons',
      paint: { 'fill-color': ['match', ['get','kind'], 'glacier', C.glacier, C.eau],
               'fill-outline-color': C.eauTrait } },
    { id: 'cours-eau-mineur', type: 'line', source: 'osm', 'source-layer': 'water_lines',
      minzoom: 11,
      filter: ['all', ['!=', ['get','tunnel'], true],
                      ['in', ['get','kind'], ['literal',['stream','ditch','canal']]]],
      paint: { 'line-color': C.eauTrait, 'line-width': larg([[12,1.5],[17,4]]) } },

                'icon-text-fit-padding': [1, 4, 1, 4],
                'text-padding': 2,
                'icon-allow-overlap': false,
                'text-allow-overlap': false,
                'symbol-sort-key': 10 },
      paint: { 'text-color': '#FFFFFF' } },

    { id: 'lbl-sortie', type: 'symbol', source: 'osm', 'source-layer': 'street_labels_points',
      minzoom: 13,
      layout: { 'text-field': ['get','ref'], 'text-font': POLICE_G, 'text-size': 11,
                'icon-image': 'ecusson', 'icon-text-fit': 'both',
                'icon-text-fit-padding': [1, 4, 1, 4] },
      paint: { 'text-color': '#FFFFFF' } },

    /* POI discrets : pastille blanche liseré bleu. */
    { id: 'poi', type: 'circle', source: 'osm', 'source-layer': 'pois',
      minzoom: 16,
      filter: ['any',
        ['in', ['get','amenity'], ['literal',
          ['townhall','police','hospital','clinic','fire_station','post_office',
           'university','courthouse','place_of_worship','theatre','museum']]],
        ['in', ['get','tourism'], ['literal',['museum','attraction','viewpoint']]]],
      paint: {
        'circle-color': '#FFFFFF',
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 16, 3.5, 18, 6],
        'circle-stroke-color': '#1466B2',
        'circle-stroke-width': 1.5
      } },

    { id: 'lbl-quartier', type: 'symbol', source: 'osm', 'source-layer': 'place_labels',
      minzoom: 12,
      filter: ['in', ['get','kind'], ['literal',['suburb','quarter']]],
      layout: {
        'text-field': ['get','name'],
        'text-font': POLICE,
        'text-size': ['interpolate', ['linear'], ['zoom'], 12, 11, 15, 13],
        'text-padding': 8,
        'text-max-width': 8
      },
      paint: {
        'text-color': C.texte, 'text-halo-color': C.texteHalo, 'text-halo-width': 1.4,
        'text-opacity': ['interpolate', ['linear'], ['zoom'], 15, 1, 17, 0.4]
      } },

    { id: 'lbl-voisinage', type: 'symbol', source: 'osm', 'source-layer': 'place_labels',
      minzoom: 14,
      filter: ['==', ['get','kind'], 'neighbourhood'],
      layout: {
        'text-field': ['get','name'],
        'text-font': POLICE,
        'text-size': 11,
        'text-padding': 10,
        'text-max-width': 7
      },
      paint: {
        'text-color': '#55524C', 'text-halo-color': C.texteHalo, 'text-halo-width': 1.2
      } },

    { id: 'lbl-locality', type: 'symbol', source: 'osm', 'source-layer': 'place_labels',
      minzoom: 14,
      filter: ['in', ['get','kind'], ['literal',['locality','farm','isolated_dwelling']]],
      layout: {
        'text-field': ['get','name'],
        'text-font': POLICE_I,
        'text-size': 10,
        'text-padding': 14,
        'text-max-width': 7
      },
      paint: {
        'text-color': '#55524C',
        'text-halo-color': C.texteHalo,
        'text-halo-width': 1.2,
        'text-opacity': 0.85
      } }
  ]
};

/* ------------------------------------------------------------------------ */

/* ------------------------------------------------------------------------ */
const STYLE_IGN = 'https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json';
const VUE = { center: [7.05, 45.35], zoom: 8 };   // frontière franco-italienne

const commun = { attributionControl: false, ...VUE };
const carteOSM = new maplibregl.Map({ container: 'carte-osm', style: styleOSM, hash: true, ...commun });
const carteIGN = new maplibregl.Map({ container: 'carte-ign', style: STYLE_IGN, ...commun });

carteOSM.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

/* --- Zoom HUD ------------------------------------------------------------
   Slider + boutons ± + niveau affiché. Les deux cartes restent sync via
   suivre() ; on pilote uniquement carteOSM. */
const Z_MIN = 0, Z_MAX = 18, Z_PAS = 0.5;
const zoomSlider = document.getElementById('zoom-slider');
const zoomVal    = document.getElementById('zoom-val');
let zoomUi = false;   // évite de renvoyer setZoom quand l'UI suit la carte

function afficherZoom(z) {
  const n = Math.min(Z_MAX, Math.max(Z_MIN, z));
  zoomVal.textContent = 'z ' + n.toFixed(1);
  zoomSlider.value = n.toFixed(1);
}

function appliquerZoom(z) {
  const n = Math.min(Z_MAX, Math.max(Z_MIN, z));
  zoomUi = true;
  afficherZoom(n);
  carteOSM.zoomTo(n, { duration: 0 });
  zoomUi = false;
}

zoomSlider.addEventListener('input', () => appliquerZoom(+zoomSlider.value));
document.getElementById('zoom-moins').addEventListener('click',
  () => appliquerZoom(carteOSM.getZoom() - Z_PAS));
document.getElementById('zoom-plus').addEventListener('click',
  () => appliquerZoom(carteOSM.getZoom() + Z_PAS));
carteOSM.on('zoom', () => { if (!zoomUi) afficherZoom(carteOSM.getZoom()); });
afficherZoom(VUE.zoom);

/* --- Mode Copie / Rideau ------------------------------------------------ */
function setMode(mode) {
  const copie = mode === 'copie';
  document.body.classList.toggle('mode-copie', copie);
  document.body.classList.toggle('mode-rideau', !copie);
  document.getElementById('mode-copie').setAttribute('aria-pressed', copie ? 'true' : 'false');
  document.getElementById('mode-rideau').setAttribute('aria-pressed', copie ? 'false' : 'true');
  requestAnimationFrame(() => {
    carteOSM.resize();
    carteIGN.resize();
    syncCameras();
  });
}
document.getElementById('mode-copie').addEventListener('click', () => setMode('copie'));
document.getElementById('mode-rideau').addEventListener('click', () => setMode('rideau'));

/* --- Écusson de route ----------------------------------------------------
   MapLibre sait étirer une image en 9 tranches (stretchX/stretchY/content)
   pour l'ajuster au texte via icon-text-fit. On la dessine sur un canvas
   plutôt que de maintenir un fichier sprite pour un seul symbole. */
function creerEcusson(carte) {
  if (carte.hasImage('ecusson')) return;
  const L = 28, H = 22, R = 5, PR = 2;   // PR : rendu en 14×11 px CSS
  const c = document.createElement('canvas');
  c.width = L; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = C.ecusson;
  g.strokeStyle = C.ecussonBord;
  g.lineWidth = 1;
  g.beginPath();
  g.roundRect ? g.roundRect(0.5, 0.5, L - 1, H - 1, R)
              : g.rect(0.5, 0.5, L - 1, H - 1);
  g.fill(); g.stroke();
  carte.addImage('ecusson', g.getImageData(0, 0, L, H), {
    stretchX: [[R + 2, L - R - 2]],
    stretchY: [[R + 2, H - R - 2]],
    content:  [3, 2, L - 3, H - 2],
    pixelRatio: PR
  });
}
carteOSM.on('load', () => creerEcusson(carteOSM));
carteOSM.on('styleimagemissing', e => { if (e.id === 'ecusson') creerEcusson(carteOSM); });

/* --- Synchronisation des deux caméras ------------------------------------
   Le drapeau évite la boucle : A bouge → B saute → B émet "move" → A saute… */
let enCours = false;
function suivre(source, cible) {
  source.on('move', () => {
    if (enCours) return;
    enCours = true;
    cible.jumpTo({
      center:  source.getCenter(),
      zoom:    source.getZoom(),
      bearing: source.getBearing(),
      pitch:   source.getPitch()
    });
    enCours = false;
  });
}
suivre(carteOSM, carteIGN);
suivre(carteIGN, carteOSM);

/* Hash ne pilote que OSM : forcer IGN dès que les deux styles sont prêts. */
function syncCameras() {
  if (enCours) return;
  enCours = true;
  carteIGN.jumpTo({
    center:  carteOSM.getCenter(),
    zoom:    carteOSM.getZoom(),
    bearing: carteOSM.getBearing(),
    pitch:   carteOSM.getPitch()
  });
  enCours = false;
  afficherZoom(carteOSM.getZoom());
}
carteOSM.on('load', syncCameras);
carteIGN.on('load', syncCameras);
carteOSM.on('load', () => { carteOSM.resize(); carteIGN.resize(); });
carteIGN.on('load', () => { carteOSM.resize(); carteIGN.resize(); });

/* --- Rideau --------------------------------------------------------------- */
const rideau  = document.getElementById('rideau');
const poignee = document.getElementById('poignee');
let pos = 50;

function placer(p) {
  pos = Math.min(100, Math.max(0, p));
  document.documentElement.style.setProperty('--pos', pos + '%');
  poignee.setAttribute('aria-valuenow', Math.round(pos));
}

function depuisPointeur(e) { placer((e.clientX / window.innerWidth) * 100); }

poignee.addEventListener('pointerdown', e => {
  poignee.setPointerCapture(e.pointerId);
  poignee.addEventListener('pointermove', depuisPointeur);
  e.preventDefault();
});
poignee.addEventListener('pointerup', e => {
  poignee.releasePointerCapture(e.pointerId);
  poignee.removeEventListener('pointermove', depuisPointeur);
});
poignee.addEventListener('keydown', e => {
  const pas = e.shiftKey ? 10 : 2;
  if (e.key === 'ArrowLeft')  { placer(pos - pas); e.preventDefault(); }
  if (e.key === 'ArrowRight') { placer(pos + pas); e.preventDefault(); }
  if (e.key === 'Home')       { placer(0);   e.preventDefault(); }
  if (e.key === 'End')        { placer(100); e.preventDefault(); }
});
rideau.addEventListener('dblclick', () => placer(50));

/* --- Diagnostic ----------------------------------------------------------
   Une erreur de style fait échouer le rendu en silence : on l'affiche. */
const diag = document.getElementById('diag');
const vus = new Set();
function signaler(msg) {
  if (vus.has(msg)) return;
  vus.add(msg);
  const d = document.createElement('div');
  d.textContent = msg;
  diag.appendChild(d);
}
[carteOSM, carteIGN].forEach(c => c.on('error', e => {
  const m = (e && e.error && e.error.message) || 'erreur inconnue';
  console.warn('MapLibre:', m);
  signaler(m);
}));

fetch('https://vector.openstreetmap.org/shortbread_v1/tilejson.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
  .catch(e => signaler('Tuiles OSMF injoignables (' + e.message + ')'));

/* Le nom du fontstack doit correspondre exactement à un dossier de
   protomaps/basemaps-assets : « Noto Sans Regular », « Noto Sans Medium »,
   « Noto Sans Italic ». Il n'y a pas de graisse Bold. */
[POLICE[0], POLICE_G[0], POLICE_I[0]].forEach(f =>
  fetch(styleOSM.glyphs.replace('{fontstack}', encodeURIComponent(f)).replace('{range}', '0-255'))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .catch(e => signaler('Police « ' + f + ' » indisponible (' + e.message +
      ') : les libellés correspondants ne s’afficheront pas.')));
</script>
